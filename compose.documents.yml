name: neurvia-documents
services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: neurvia
      POSTGRES_USER: neurvia
      POSTGRES_PASSWORD: ${NEURVIA_POSTGRES_PASSWORD:-neurvia-local-db}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurvia -d neurvia"]
      interval: 3s
      timeout: 3s
      retries: 20
  objects:
    restart: unless-stopped
    image: chrislusf/seaweedfs@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    entrypoint: ["weed"]
    command: ["mini", "-dir=/data", "-ip=objects", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${DOCUMENT_S3_ACCESS_KEY:-neurvia-local}
      AWS_SECRET_ACCESS_KEY: ${DOCUMENT_S3_SECRET_KEY:-neurvia-local-object-password}
      S3_BUCKET: ${DOCUMENT_S3_BUCKET:-neurvia-documents}
    ports:
      - "127.0.0.1:59000:8333"
    volumes:
      - object_data:/data
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.documents
    command: ["alembic", "upgrade", "head"]
    environment: &app_environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${NEURVIA_DATABASE_URL:-postgresql+psycopg://neurvia:neurvia-local-db@db:5432/neurvia}
      DOCUMENT_S3_ENDPOINT: http://objects:8333
      DOCUMENT_S3_ACCESS_KEY: ${DOCUMENT_S3_ACCESS_KEY:-neurvia-local}
      DOCUMENT_S3_SECRET_KEY: ${DOCUMENT_S3_SECRET_KEY:-neurvia-local-object-password}
      DOCUMENT_S3_BUCKET: ${DOCUMENT_S3_BUCKET:-neurvia-documents}
      LLM_BASE_URL: ${NEURVIA_OLLAMA_URL:-http://host.docker.internal:11434}
      MODEL_BACKEND: ${MODEL_BACKEND:-ollama}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      DOCUMENT_MAX_UPLOAD_MB: ${DOCUMENT_MAX_UPLOAD_MB:-24}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-120}
      DOCUMENT_OCR_LANGUAGES: ${DOCUMENT_OCR_LANGUAGES:-eng+fra+ara}
      DOCUMENT_VISION_ENABLED: ${DOCUMENT_VISION_ENABLED:-true}
      DOCUMENT_VISION_MODEL: ${DOCUMENT_VISION_MODEL:-qwen3.5:9b}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-120}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:9b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      JWT_SECRET: ${JWT_SECRET:-neurvia-compose-local-only-32-bytes}
    depends_on:
      db:
        condition: service_healthy
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile.documents
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      objects:
        condition: service_started
    ports:
      - "127.0.0.1:8010:8000"
    init: true
  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile.documents
    command: ["python", "-m", "app.documents.worker"]
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      objects:
        condition: service_started
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 2g
    cpus: 2
  web:
    profiles: ["web"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.documents.web
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:3152:3000"
volumes:
  postgres_data:
  object_data:
