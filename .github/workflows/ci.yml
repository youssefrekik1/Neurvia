name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: neurvia
          POSTGRES_USER: neurvia
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurvia -d neurvia"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on PostgreSQL
        env:
          NEURVIA_TEST_POSTGRES: postgresql+psycopg://neurvia:ci-only-password@127.0.0.1:5432/neurvia
        run: python -m pytest -q
      - name: API contract is up to date
        run: |
          python -m tools.export_contract
          git diff --exit-code -- ../../docs/openapi.json

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npx --yes openapi-typescript@7.10.1 docs/openapi.json --output docs/api-types.d.ts
          git diff --exit-code -- docs/api-types.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
